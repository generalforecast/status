# General Forecast status page, powered by Upptime (https://upptime.js.org)
owner: generalforecast
repo: status

sites:
  - name: General Forecast Search
    url: https://search.generalforecast.com

status-website:
  baseUrl: /
  logoUrl: /logo-192.png
  favicon: /logo-192.png
  customHeadHtml: |
    <style>
      @font-face {
        font-family: "Neue Montreal";
        src: url(data:font/woff2;base64,) format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      :root {
        --body-background-color: #ffffff;
        --body-text-color: #16181b;
        --card-background-color: #f6f6f7;
        --nav-background-color: #ffffff;
        --nav-border-bottom-color: #e9e9ea;
        --nav-current-border-bottom-color: #16181b;
        --card-border-color: #e9e9ea;
        --down-border-left-color: #b23b3b;
        --down-background-color: #f6e9e9;
        --degraded-border-left-color: #a8761f;
        --up-border-left-color: #2f6b4f;
        --tag-color: #ffffff;
        --tag-up-background-color: #2f6b4f;
        --tag-down-background-color: #b23b3b;
        --tag-degraded-background-color: #a8761f;
        --change-background-color: #a8761f;
        --error-button-border-color: #16181b;
        --error-button-background-color: #16181b;
        --error-button-color: #ffffff;
        --submit-button-border-color: #16181b;
        --submit-button-background-color: #16181b;
        --submit-button-color: #ffffff;
        --graph-opacity: 1;
        --graph-filter: saturate(0.6);
      }
      body { font-family: "Neue Montreal", "Helvetica Neue", Arial, sans-serif !important; }
      .card { border-radius: 2px !important; }
      .logo img { border-radius: 0 !important; }
    </style>
  logoHref: https://search.generalforecast.com
  name: General Forecast Status
  introTitle: "**General Forecast** system status"
  introMessage: Live status of search.generalforecast.com, checked every 5 minutes.
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/$OWNER/$REPO
